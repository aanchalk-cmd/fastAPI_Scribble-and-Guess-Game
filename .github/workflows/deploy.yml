name: Deploy Scribble to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest code
        shell: bash
        env:
          PROJECT_DIR: /home/hardik/projects/fastAPI_Scribble-and-Guess-Game
          SERVICE_NAME: scribble.service
          HEALTH_URL: http://127.0.0.1:8000/
          STARTUP_TIMEOUT: "60"
        # Run the script from the freshly fetched checkout; it fetches/resets itself,
        # runs preflight checks, restarts the service and waits for it to be healthy.
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          git fetch origin main
          git show origin/main:scripts/deploy.sh > /tmp/scribble-deploy.sh
          bash /tmp/scribble-deploy.sh
