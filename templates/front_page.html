<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Movie Guess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/lobby.css?v=rooms4">
</head>
<body class="lobby-body">
    <div
        id="lobby-app"
        class="lobby-shell"
        data-categories='{{ categories | tojson }}'
        data-random-name="{{ random_name }}"
        data-screen="public"
    >
        <header class="lobby-top">
            <h1 class="brand-title" id="brand-title">Movie Guess</h1>
            <div class="top-actions">
                <!-- The name this player joins with: a random one until they edit it -->
                <div class="playing-as" id="playing-as">
                    <label class="playing-as-label" for="playing-name-input">Playing as</label>
                    <div class="playing-as-row">
                        <span class="playing-as-name" id="playing-name-sizer" data-value="{{ random_name }}">
                            <input
                                type="text"
                                id="playing-name-input"
                                class="playing-as-input js-name-input"
                                value="{{ random_name }}"
                                maxlength="10"
                                size="1"
                                autocomplete="nickname"
                                spellcheck="false"
                            >
                        </span>
                        <button type="button" class="playing-as-edit" id="playing-name-edit" aria-label="Edit name">
                            <img src="/static/img/icons/ic-edit.svg" width="30.875" height="31.6577" alt="">
                        </button>
                    </div>
                </div>
                <button type="button" class="top-btn" id="top-nav-btn" data-action="create">CREATE ROOOM</button>
            </div>
        </header>

        <div id="error-banner" class="error-banner" role="alert"></div>

        <div class="lobby-stage">
            <!-- Left cinema props — all 3 kept fully in view -->
            <aside class="decor-rail decor-rail-left" aria-hidden="true">
                <img class="decor-img decor-img-clap" src="/static/img/lobby/clap.png" alt="">
                <img class="decor-img decor-img-ticket" src="/static/img/lobby/ticket.png" alt="">
                <img class="decor-img decor-img-soda" src="/static/img/lobby/soda.png" alt="">
            </aside>

            <div class="lobby-main">
                <!-- ===== Public rooms (landing) ===== -->
                <section id="screen-public" class="screen" aria-label="Public rooms">
                    <div class="film-card">
                        <div class="film-inner public-inner">
                            <h2 class="public-title">Public Roooms</h2>

                            <div id="room-list" class="room-list mg-scroll">
                                <p class="empty-state">Looking for active games...</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ===== Create room / I have a code ===== -->
                <section id="screen-create" class="screen" aria-label="Create room">
                    <div class="film-card">
                        <div class="film-inner stack">
                            <div class="create-fields">
                                <div class="mode-tabs" role="tablist">
                                    <button type="button" class="mode-tab is-active" data-tab="create" role="tab">CREATE ROOOM</button>
                                    <button type="button" class="mode-tab" data-tab="code" role="tab">I HAVE A CODE</button>
                                </div>

                                <div id="create-pane" class="create-pane">
                                    <div>
                                        <span class="field-label" id="category-label">Category</span>
                                        <div class="mg-select" id="category-select">
                                            <button
                                                type="button"
                                                class="mg-select-trigger"
                                                id="category-trigger"
                                                aria-haspopup="listbox"
                                                aria-expanded="false"
                                                aria-labelledby="category-label category-trigger"
                                            >
                                                <span class="mg-select-value" id="category-value"></span>
                                                <img class="mg-select-chevron" src="/static/img/icons/ic-chevron-down.svg" width="24" height="24" alt="">
                                            </button>
                                            <ul class="mg-select-list mg-scroll hidden" id="category-list" role="listbox" aria-multiselectable="true" aria-labelledby="category-label" tabindex="-1"></ul>
                                        </div>
                                    </div>

                                    <div>
                                        <span class="field-label">Number of Round</span>
                                        <div id="rounds-pills" class="pill-row"></div>
                                    </div>

                                    <div class="slider-field">
                                        <div class="field-row">
                                            <span class="field-label">Time Duration</span>
                                            <span class="field-value" id="duration-val">60 SEC</span>
                                        </div>
                                        <input
                                            type="range"
                                            id="duration-slider"
                                            class="mg-slider"
                                            min="30"
                                            max="120"
                                            step="15"
                                            value="60"
                                            aria-label="Time duration in seconds"
                                        >
                                    </div>

                                    <div class="room-access">
                                        <div class="toggle-row">
                                            <label class="toggle">
                                                <input type="checkbox" id="public-toggle" aria-labelledby="public-toggle-label" checked>
                                                <img class="toggle-icon toggle-icon-on" src="/static/img/icons/ic-switch-on.svg" width="43.3333" height="35.2734" alt="">
                                                <img class="toggle-icon toggle-icon-off" src="/static/img/icons/ic-switch-off.svg" width="43.3333" height="35.2734" alt="">
                                            </label>
                                            <span class="toggle-label" id="public-toggle-label">Public Room</span>
                                            <span class="toggle-note" id="max-players-note">Maximum 10 players allowed.</span>
                                        </div>

                                    </div>
                                </div>

                                <div id="code-pane" class="hidden create-pane">
                                    <div>
                                        <label class="field-label" for="have-code-input">Room Code</label>
                                        <input
                                            type="text"
                                            id="have-code-input"
                                            class="name-input code-input"
                                            maxlength="6"
                                            placeholder="ENTER ROOM CODE"
                                            autocomplete="off"
                                            spellcheck="false"
                                        >
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn-primary btn-cta" id="create-copy-btn">CREATE &amp; COPY LINK</button>
                            <button type="button" class="btn-primary btn-cta btn-yellow hidden" id="join-room-btn">JOIN ROOM</button>
                        </div>
                    </div>
                </section>

                <!-- Submitted by lobby.js with the same fields POST /join already expects -->
                <form id="join-form" class="hidden" action="/join" method="POST">
                    <input type="hidden" name="name" id="field-name" value="">
                    <input type="hidden" name="action" id="field-action" value="create">
                    <input type="hidden" name="room_type" id="field-room-type" value="public">
                    <input type="hidden" name="max_players" id="field-max-players" value="10">
                    <input type="hidden" name="rounds" id="field-rounds" value="3">
                    <input type="hidden" name="duration" id="field-duration" value="60">
                    <input type="hidden" name="category" id="field-category" value="hollywood">
                    <input type="hidden" name="room_code" id="field-room-code" value="">
                    <input type="hidden" name="tab_id" id="field-tab-id" value="">
                </form>
            </div>

            <!-- Right cinema props — all 3 kept fully in view -->
            <aside class="decor-rail decor-rail-right" aria-hidden="true">
                <img class="decor-img decor-img-reel" src="/static/img/lobby/reel.png" alt="">
                <img class="decor-img decor-img-popcorn" src="/static/img/lobby/popcorn-thumb.png" alt="">
                <img class="decor-img decor-img-camera" src="/static/img/lobby/camera.png" alt="">
            </aside>
        </div>
    </div>

    <script src="/static/js/lobby.js?v=guest3" defer></script>
</body>
</html>
